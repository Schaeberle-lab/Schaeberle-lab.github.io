- name: "BioFLOW"
  full_title: "Development of a Microfluidic In Vivo Mimicking Assay to Facilitate Bacterial Biofilm Research"
  description: "Development of a microfluidic platform that mimics natural flow conditions to investigate bacterial biofilm formation, evaluate antimicrobial compounds, and monitor biofilm treatment and regrowth, with a particular focus on Xylella fastidiosa."
  funding: "Postgraduate Scholarship of Justus Liebig University Giessen"
  duration: "4 years"
  researcher: "Flaviana Chrysanthia Susanto"
  supervisors:
    - "Prof. Dr. Till Schäberle"
    - "Dr. Michael Marner"
  institutions:
    - "Justus Liebig University Giessen"
    - "Fraunhofer IME"
  image: ""
  url: "https://www.ime.fraunhofer.de/en/Research_Divisions/bioresources/Our_projects/development-of-a-microfluidic-in-vivo-mimicking-assay-to-facilit.html"

- name: "MbioShrimp"
  full_title: "Bio-Based Substances for the Prevention of Melanosis in Certified Organic Shrimp"
  description: "Development of natural products derived from fungi and plants to prevent post-mortem melanosis in shrimp. The project combines natural product discovery, polyphenol oxidase inhibition, fermentation optimization, compound isolation, and application trials to identify sustainable alternatives to conventional antimelanotic treatments."
  funding: "BMFTR - Ideas Competition: New Products for the Bioeconomy"
  duration: "December 2021 - December 2025"
  researcher: "Nicolas Reyes Castillo (associated doctoral project)"
  supervisors:
    - "Prof. Dr. Till Schäberle"
    - "Dr. Marius Spohn"
  institutions:
    - "Fraunhofer IME"
    - "Justus Liebig University Giessen"
    - "Naturland e.V."
  image: ""
  url: "https://www.ime.fraunhofer.de/en/Research_Divisions/bioresources/Our_projects/MbioShrimp.html"


