    - "Fraunhofer IME"
  image: ""
  url: "https://www.ime.fraunhofer.de/en/Research_Divisions/bioresources/Our_projects/a-platform-for-the-discovery-of-anthelmintic-and-antischistosoma.html"

- name: "Beta-Lactam Antibiotic Recovery"
  full_title: "Biosynthesis and Antimicrobial Activity Investigation of Sulfonated Monobactams and Derivatives from Bacteroidetes"
  description: "Discovery and characterization of sulfonated monobactams from Bacteroidetes through genome mining, microbial fermentation and chemical analysis, aiming to develop new compounds against multidrug-resistant Gram-negative bacteria."
