  full_title: "A Platform for the Discovery of Anthelmintic and Antischistosomal Microbial Natural Products"
  description: "Discovery of bioactive microbial natural products against parasitic helminths using Caenorhabditis elegans for primary screening and Schistosoma mansoni for activity confirmation."
  funding: "Postgraduate Scholarship of Justus Liebig University Giessen"
